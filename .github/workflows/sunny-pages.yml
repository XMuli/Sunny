name: Deploy Sunny Pages
on:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: false
          persist-credentials: false
      - name: Prepare static site
        run: |
          mkdir -p _site/en
          cp index.html farewell.css legacy-site.html favicon.ico logo.svg sunny-site-archive.md _sidebar.md _coverpage.md _site/
          cp -r zh-cn _site/
          cp en/index.html farewell.css _site/en/
          sed 's|<head>|<head><base href="../">|' legacy-site.html > _site/en/legacy-site.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deployment
